name: Deploy main site

on:
  push:
    branches: [main]
    # Anything that can change the main site's build.
    paths:
      - apps/site/**
      - packages/ui/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .node-version
      - firebase.json
      - .firebaserc
      - .github/workflows/deploy-site.yml
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  PROJECT: kcsu-admin
  WIF_PROVIDER: projects/443929654886/locations/global/workloadIdentityPools/github/providers/kcsu-web-repo
  DEPLOY_SA: github-deploy-web@kcsu-admin.iam.gserviceaccount.com
  FIREBASE_TOOLS: firebase-tools@15.33.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter site...
      - run: pnpm --filter site check
      - run: pnpm --filter site build

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Deploy to Firebase Hosting
        run: npx --yes "$FIREBASE_TOOLS" deploy --only hosting:site --project "$PROJECT" --non-interactive
